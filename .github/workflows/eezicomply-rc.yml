name: EeziComply RC Gate

on:
  push:
    branches:
      - main
      - 'sprint/eezicomply-*'
    paths:
      - 'eezicomply/**'
      - 'scripts/eezicomply-rc-check.mjs'
      - '.github/workflows/eezicomply-rc.yml'
  pull_request:
    paths:
      - 'eezicomply/**'
      - 'scripts/eezicomply-rc-check.mjs'
      - '.github/workflows/eezicomply-rc.yml'

jobs:
  release-gate:
    name: Validate EeziComply release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run EeziComply RC checks
        run: node scripts/eezicomply-rc-check.mjs
